<title>Кнопки построек</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: sticky gold slider on top, grid of variant cards; each card holds a 360px mock of the bottom HUD bar with the real button sizes (105x66 build, 160x66 upgrade). */
:root {
  --bg: #f6f1e7;
  --card: #fffaf0;
  --fg: #1f2937;
  --muted: #6b6258;
  --line: #e4d9c3;
  --accent: #b7561a;
  --accent-fg: #ffffff;
  /* game palette (COLORS in game.ts), fixed in both themes */
  --g-outline: #1f2937;
  --g-button: #ffb53d;
  --g-disabled: #c9bfae;
  --g-gold: #ffc83d;
  --g-gold-dark: #b7811a;
  --g-edge: #8a5a2b;
  --g-grass: #7cc46a;
  --g-red: #d93a3a;
  --g-red-dark: #a82020;
  --ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1814; --card: #25211b; --fg: #f1e9d8; --muted: #a79d8a; --line: #3a3329; --accent: #ffb53d; --accent-fg: #1f2937;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1814; --card: #25211b; --fg: #f1e9d8; --muted: #a79d8a; --line: #3a3329; --accent: #ffb53d; --accent-fg: #1f2937;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
.ctl {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.ctl h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .01em; }
.ctl p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; max-width: 70ch; }
.sl { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gold-read { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; min-width: 112px; font-variant-numeric: tabular-nums; }
.gold-read svg { width: 28px; height: 28px; }
#gold { flex: 1 1 260px; min-width: 0; accent-color: var(--accent); height: 28px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: 800 13px var(--ui); padding: 6px 10px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--card); color: var(--fg);
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip:focus-visible, #gold:focus-visible, .kbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 18px; padding-top: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h2 { margin: 0; font-size: 16px; font-weight: 900; }
.card p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.4; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

/* HUD bar mock */
.bar {
  width: min(100%, 360px); background: var(--g-grass); border-radius: 10px; overflow: hidden;
  border-top: 3px solid var(--g-edge);
}
.bar .in { background: rgba(31, 41, 55, .35); padding: 6px 12px; display: grid; gap: 4px; }
.rowb { display: flex; justify-content: center; gap: 10px; height: 66px; }

/* Button base, mirrors Button.ts: shadow, face, shine, outline */
.kbtn {
  --p: 1;
  position: relative; flex: 1 1 0; max-width: 132px; height: 66px; padding: 0; border: 0; cursor: pointer;
  font-family: var(--ui); font-weight: 800; color: var(--g-outline); text-align: center;
  border-radius: 14px; background: transparent; isolation: isolate;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
.rowb.up .kbtn { max-width: 160px; }
.kbtn .face {
  position: absolute; inset: 0; border-radius: 14px; background: var(--g-button);
  border: 2.5px solid var(--g-outline); overflow: hidden; z-index: 0;
  box-shadow: 0 3px 0 rgba(31, 41, 55, .35);
}
.kbtn .face::after { /* shine band */
  content: ""; position: absolute; left: 4px; right: 4px; top: 3px; height: 34%; border-radius: 8px; background: rgba(255,255,255,.32);
}
.kbtn .fill, .kbtn .hatch { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.kbtn .t1, .kbtn .t2, .kbtn .t3 { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 4px; z-index: 1; white-space: nowrap; }
.kbtn .t1 { top: 9px; font-size: 14px; }
.kbtn .t1 svg { width: 21px; height: 21px; flex: none; }
.kbtn .t2 { top: 28px; font-size: 12px; opacity: .8; font-weight: 700; }
.kbtn .t3 { top: 43px; font-size: 14px; font-variant-numeric: tabular-nums; }
.kbtn .t3 svg { width: 14px; height: 14px; flex: none; }
.kbtn:active .face { transform: translateY(2px); box-shadow: 0 1px 0 rgba(31,41,55,.35); filter: brightness(.93); }
.kbtn .pill { display: inline-flex; align-items: center; gap: 4px; }
.kbtn.pop { animation: pop .42s ease-out; }
.kbtn.shake { animation: shake .36s ease-in-out; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.kbtn .slash { display: none; }

/* A: grey family. Static price everywhere. */
.v1 .cant .face, .v2 .cant .face, .v3 .cant .face { background: var(--g-disabled); box-shadow: 0 2px 0 rgba(31,41,55,.25); }
.v1 .cant .face::after, .v2 .cant .face::after, .v3 .cant .face::after { opacity: 0; }
.v1 .cant .t1, .v1 .cant .t2, .v3 .cant .t1, .v3 .cant .t2 { color: #5d564c; }
.v1 .cant .t1 svg, .v3 .cant .t1 svg { filter: grayscale(.9); opacity: .55; }
.v1 .cant .t3 { color: var(--g-red-dark); }
.v1 .cant .t3 svg, .v3 .cant .t3 svg { opacity: .6; filter: grayscale(.5); }

/* A2: grey face, building stays in colour, red price plate */
.v2 .cant .t1, .v2 .cant .t2 { color: #5d564c; }
.v2 .cant .t3 { top: 41px; }
.v2 .cant .pill { background: var(--g-red); color: #fff; border: 2px solid var(--g-outline); border-radius: 999px; padding: 0 9px 0 5px; height: 20px; font-size: 13px; text-shadow: 0 1px 0 rgba(0,0,0,.35); }

/* A3: grey face, grey price, thin gold progress strip along the bottom */
.v3 .cant .t3 { color: #5d564c; top: 40px; }
.v3 .fill { opacity: 1; top: auto; height: 7px; background: linear-gradient(#ffc84d, #ff9f1c); border-top: 2px solid var(--g-outline); transform-origin: left center; transform: scaleX(var(--p)); transition: transform .12s linear; }
.v3 .kbtn:not(.cant) .fill { opacity: 0; }
.v3 .cant .face { background: linear-gradient(var(--g-disabled), var(--g-disabled)); }
.v3 .cant .rail { display: block; }
.rail { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(31,41,55,.28); z-index: 0; }

/* B: gold fill family */
.v4 .cant .face, .v5 .cant .face, .v6 .cant .face { background: #5d5560; }
.v4 .cant .face::after, .v5 .cant .face::after, .v6 .cant .face::after { opacity: 0; }
.v4 .fill, .v6 .fill { opacity: 1; background: linear-gradient(#ffc84d, #ff9f1c); transform-origin: left center; transform: scaleX(var(--p)); transition: transform .12s linear; }
.v5 .fill { opacity: 1; background: linear-gradient(90deg, #ffc84d, #ff9f1c); transform-origin: center bottom; transform: scaleY(var(--p)); transition: transform .12s linear; }
.v4 .kbtn:not(.cant) .fill, .v6 .kbtn:not(.cant) .fill { transform: scaleX(1); }
.v5 .kbtn:not(.cant) .fill { transform: scaleY(1); }
.v4 .cant .t1, .v4 .cant .t2, .v4 .cant .t3,
.v5 .cant .t1, .v5 .cant .t2, .v5 .cant .t3,
.v6 .cant .t1, .v6 .cant .t2, .v6 .cant .t3 { color: #fff; text-shadow: 0 1px 0 var(--g-outline), 0 0 3px var(--g-outline), 0 0 3px var(--g-outline); }
.v4 .cant .t2, .v5 .cant .t2, .v6 .cant .t2 { opacity: 1; }
.v4 .cant .t1 svg, .v5 .cant .t1 svg, .v6 .cant .t1 svg { filter: drop-shadow(0 0 1.5px #1f2937); }

/* B3: deficit chip in the corner */
.def { display: none; position: absolute; top: -7px; right: -5px; z-index: 3; background: var(--g-red); color: #fff; border: 2px solid var(--g-outline); border-radius: 999px; font-size: 12px; padding: 0 6px; height: 20px; line-height: 16px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.v6 .cant .def { display: block; }

@media (prefers-reduced-motion: reduce) { .kbtn.pop, .kbtn.shake { animation: none; } .v2 .fill { transition: none; } }
</style>

<div class="wrap">
  <div class="ctl">
    <h1>Кнопки построек</h1>
    <p>Двигайте ползунок золота и смотрите, как кнопка читается при нехватке денег. Нажмите на недоступную кнопку: она трясётся. Размеры и цвета взяты из игры (кнопка 105×66 и 160×66, портрет 360 px).</p>
    <div class="sl">
      <div class="gold-read"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="15" r="12" fill="#b7811a"/><circle cx="14" cy="14" r="12" fill="#ffc83d"/><circle cx="14" cy="14" r="7.4" fill="none" stroke="#b7811a" stroke-width="2"/><circle cx="9.8" cy="9.8" r="2.1" fill="#fff" fill-opacity=".55"/></svg><span id="goldv">0</span></div>
      <input id="gold" type="range" min="0" max="130" step="1" value="12" aria-label="Золото">
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  var ICON = {
    mine: '<svg viewBox="0 0 24 24"><rect x="2" y="4.5" width="20" height="16" rx="7" fill="#8b6b4a" stroke="#1f2937" stroke-width="1.6"/><rect x="7" y="9.5" width="10" height="11" rx="4.5" fill="#2b2118"/><circle cx="12.6" cy="17.5" r="3.4" fill="#ffc83d" stroke="#1f2937" stroke-width="1.4"/></svg>',
    barracks: '<svg viewBox="0 0 24 24"><path d="M2 20 L12 5 L22 20 Z" fill="#f4e3c1" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 20 L12 13 L15 20 Z" fill="#2b2118"/><path d="M12 5 V1.5" stroke="#1f2937" stroke-width="1.6"/><path d="M12 1.5 L17 2.8 L12 4.2 Z" fill="#e23b3b"/></svg>',
    tower: '<svg viewBox="0 0 24 24"><rect x="6.5" y="7.5" width="11" height="14" fill="#c9c3b6" stroke="#1f2937" stroke-width="1.6"/><rect x="5.5" y="2.5" width="3" height="5" fill="#c9c3b6" stroke="#1f2937" stroke-width="1.4"/><rect x="10.5" y="2.5" width="3" height="5" fill="#c9c3b6" stroke="#1f2937" stroke-width="1.4"/><rect x="15.5" y="2.5" width="3" height="5" fill="#c9c3b6" stroke="#1f2937" stroke-width="1.4"/><path d="M10 21.5 V16 a2 2 0 0 1 4 0 V21.5Z" fill="#2b2118"/></svg>'
  };
  var COIN = '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="15.5" r="13" fill="#b7811a"/><circle cx="14" cy="14" r="13" fill="#ffc83d"/><circle cx="14" cy="14" r="8" fill="none" stroke="#b7811a" stroke-width="2.4"/><circle cx="9.5" cy="9.5" r="2.3" fill="#fff" fill-opacity=".55"/></svg>';

  var BUILD = [
    { type: 'mine', name: 'Шахта', desc: 'Много золота', cost: 30 },
    { type: 'barracks', name: 'Казармы', desc: 'Больше войск', cost: 30 },
    { type: 'tower', name: 'Башня', desc: 'Бьёт врагов', cost: 30 }
  ];
  var UPG = [
    { type: 'barracks', name: 'Улучшить → 2', desc: '×1.2 войск, +2 места', cost: 60 },
    { type: 'tower', name: 'Улучшить → 3', desc: '1.5 выстрела/с', cost: 120 }
  ];

  var VARIANTS = [
    { id: 1, tag: 'A1', name: 'Серая, цена красным', text: 'Серая кнопка без блика, иконка выцветает. Цена статичная (30), но красная.',
      price: function (g, c) { return c; } },
    { id: 2, tag: 'A2', name: 'Серая, красная плашка цены', text: 'Тот же серый фон, но здание остаётся цветным, а цена стоит в красной плашке. Статичная цена, заметна сильнее.',
      price: function (g, c) { return c; } },
    { id: 3, tag: 'A3', name: 'Серая + полоска накопления', text: 'Серая кнопка, цена серая и статичная, снизу тонкая золотая полоска показывает, сколько накоплено.',
      price: function (g, c) { return c; } },
    { id: 4, tag: 'B1', name: 'Заливка слева направо', text: 'Как в прошлый раз: тёмная кнопка заливается золотом, внутри «12 / 30».',
      price: function (g, c) { return g >= c ? c : Math.floor(g) + ' / ' + c; } },
    { id: 5, tag: 'B2', name: 'Заливка снизу вверх', text: 'Кнопка наполняется как сосуд, цена статичная. Читается быстрее, чем текст «12 / 30».',
      price: function (g, c) { return c; } },
    { id: 6, tag: 'B3', name: 'Заливка + «−18» в углу', text: 'Заливка слева направо, цена статичная, красный значок в углу показывает, сколько не хватает.',
      price: function (g, c) { return c; }, def: true }
  ];

  var goldInput = document.getElementById('gold');
  var goldV = document.getElementById('goldv');
  var grid = document.getElementById('grid');
  var all = [];

  function mkBtn(v, it) {
    var b = document.createElement('button');
    b.className = 'kbtn';
    b.type = 'button';
    b.dataset.cost = it.cost;
    var coinHtml = COIN;
    b.innerHTML = '<span class="face"><span class="rail"></span><span class="fill"></span></span><span class="def"></span>' +
      '<span class="t1">' + ICON[it.type] + '<span>' + it.name + '</span></span>' +
      '<span class="t2">' + it.desc + '</span>' +
      '<span class="t3"><span class="pill">' + coinHtml + '<span class="num"></span></span></span>';
    b.addEventListener('click', function () {
      if (b.classList.contains('cant')) {
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      }
    });
    b.addEventListener('animationend', function () { b.classList.remove('shake', 'pop'); });
    return { el: b, cost: it.cost, num: b.querySelector('.num'), def: b.querySelector('.def'), v: v, was: null };
  }

  VARIANTS.forEach(function (v) {
    var card = document.createElement('section');
    card.className = 'card v' + v.id;
    card.innerHTML = '<div><div class="tag">' + v.tag + '</div><h2>' + v.name + '</h2></div><p>' + v.text + '</p>';
    var bar = document.createElement('div');
    bar.className = 'bar';
    var inn = document.createElement('div');
    inn.className = 'in';
    var r1 = document.createElement('div'); r1.className = 'rowb';
    var r2 = document.createElement('div'); r2.className = 'rowb up';
    BUILD.forEach(function (it) { var o = mkBtn(v, it); r1.appendChild(o.el); all.push(o); });
    UPG.forEach(function (it) { var o = mkBtn(v, it); r2.appendChild(o.el); all.push(o); });
    inn.appendChild(r1); inn.appendChild(r2); bar.appendChild(inn); card.appendChild(bar);
    grid.appendChild(card);
  });

  function update() {
    var g = +goldInput.value;
    goldV.textContent = g;
    all.forEach(function (o) {
      var can = g >= o.cost;
      o.el.classList.toggle('cant', !can);
      o.el.style.setProperty('--p', Math.min(1, g / o.cost).toFixed(3));
      o.num.textContent = o.v.price(g, o.cost);
      if (o.v.def) o.def.textContent = '\u2212' + Math.ceil(o.cost - g);
      if (o.was === false && can) { o.el.classList.remove('pop'); void o.el.offsetWidth; o.el.classList.add('pop'); }
      o.was = can;
    });
    chips.forEach(function (c) { c.el.setAttribute('aria-pressed', String(c.v === g)); });
  }

  var chips = [];
  var chipBox = document.getElementById('chips');
  [0, 12, 29, 30, 59, 60, 119, 120].forEach(function (v) {
    var c = document.createElement('button');
    c.className = 'chip'; c.type = 'button'; c.textContent = v;
    c.addEventListener('click', function () { goldInput.value = v; update(); });
    chipBox.appendChild(c); chips.push({ el: c, v: v });
  });
  goldInput.addEventListener('input', update);
  update();
})();
</script>
